<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8faff"/>
      <stop offset="100%" stop-color="#ebf3fe"/>
    </linearGradient>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#013b9a"/>
      <stop offset="100%" stop-color="#3866f1"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbfdff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#013b9a" flood-opacity="0.08"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3866f1" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" rx="36" fill="url(#bg-grad)"/>
  <rect width="996" height="996" x="2" y="2" rx="34" fill="none" stroke="#dbeafe" stroke-width="3"/>

  <!-- Header Badge -->
  <g transform="translate(50, 48)">
    <rect width="240" height="44" rx="22" fill="#e0f2fe"/>
    <circle cx="22" cy="22" r="8" fill="#0284c7"/>
    <text x="40" y="28" font-family="Red Hat Display, sans-serif" font-size="16" font-weight="700" fill="#0369a1" letter-spacing="1">ONE-CLICK REPURPOSE</text>
  </g>

  <!-- Connection lines from center to 6 formats -->
  <!-- Center: (500, 360) -->
  <path d="M 420 400 C 300 440, 200 480, 190 560" fill="none" stroke="#93c5fd" stroke-width="3" stroke-dasharray="6 6"/>
  <path d="M 460 430 C 380 480, 340 500, 340 560" fill="none" stroke="#93c5fd" stroke-width="3" stroke-dasharray="6 6"/>
  <path d="M 490 440 C 490 490, 490 520, 490 560" fill="none" stroke="#3866f1" stroke-width="3.5"/>
  <path d="M 510 440 C 510 490, 510 520, 510 560" fill="none" stroke="#93c5fd" stroke-width="3" stroke-dasharray="6 6"/>
  <path d="M 540 430 C 620 480, 660 500, 660 560" fill="none" stroke="#93c5fd" stroke-width="3" stroke-dasharray="6 6"/>
  <path d="M 580 400 C 700 440, 800 480, 810 560" fill="none" stroke="#93c5fd" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- Central Master Article Card -->
  <g transform="translate(180, 120)" filter="url(#shadow)">
    <rect width="640" height="300" rx="24" fill="#ffffff" stroke="#bfdbfe" stroke-width="2.5"/>
    
    <!-- Editor Header Bar -->
    <rect width="640" height="60" rx="24" fill="#f8fafc"/>
    <path d="M 0 60 L 640 60" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="36" cy="30" r="7" fill="#ef4444"/>
    <circle cx="58" cy="30" r="7" fill="#f59e0b"/>
    <circle cx="80" cy="30" r="7" fill="#10b981"/>
    
    <rect x="115" y="15" width="140" height="30" rx="15" fill="#e0f2fe"/>
    <text x="130" y="35" font-family="Red Hat Display, sans-serif" font-size="14" font-weight="700" fill="#0284c7">ODIN ARTICLE</text>
    
    <rect x="490" y="15" width="125" height="30" rx="8" fill="#3866f1"/>
    <text x="507" y="35" font-family="Red Hat Display, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Repurpose (6) ⚡</text>

    <!-- Master Article Content -->
    <rect x="40" y="85" width="280" height="18" rx="4" fill="#013b9a"/>
    <text x="40" y="99" font-family="Red Hat Display, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Key Story: Clean Energy Summit 2026</text>
    
    <rect x="40" y="120" width="360" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="40" y="140" width="330" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="40" y="160" width="345" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="40" y="180" width="220" height="10" rx="5" fill="#e2e8f0"/>

    <g transform="translate(40, 215)">
      <rect width="110" height="28" rx="6" fill="#f1f5f9"/>
      <text x="14" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569">Word Count: 850</text>
      <rect x="120" width="95" height="28" rx="6" fill="#f1f5f9"/>
      <text x="132" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569">SEO Score: 96</text>
      <rect x="225" width="95" height="28" rx="6" fill="#dcfce7"/>
      <text x="235" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#15803d">✓ Fact-Checked</text>
    </g>

    <!-- Thumbnail in Master Card -->
    <g transform="translate(440, 85)">
      <rect width="160" height="155" rx="14" fill="#e2e8f0"/>
      <rect width="160" height="155" rx="14" fill="url(#blue-grad)" opacity="0.15"/>
      <!-- Graphic Mountain / Solar -->
      <path d="M 20 120 L 70 50 L 110 100 L 140 70 L 155 120 Z" fill="#3866f1" opacity="0.6"/>
      <circle cx="120" cy="45" r="16" fill="#f59e0b" opacity="0.8"/>
    </g>
  </g>

  <!-- 6 Repurposed Format Cards at bottom -->
  <!-- Card 1: Web Story (Vertical) -->
  <g transform="translate(50, 560)" filter="url(#shadow)">
    <rect width="130" height="370" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect width="130" height="40" rx="18" fill="#0284c7"/>
    <text x="24" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Web Story</text>
    <!-- Visual Phone UI -->
    <rect x="12" y="55" width="106" height="150" rx="10" fill="url(#blue-grad)"/>
    <text x="20" y="130" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Visual</text>
    <text x="20" y="145" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Story Slide</text>
    <rect x="12" y="220" width="90" height="8" rx="4" fill="#94a3b8"/>
    <rect x="12" y="236" width="100" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="12" y="252" width="75" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="25" y="320" width="80" height="28" rx="14" fill="#e0f2fe"/>
    <text x="38" y="338" font-family="sans-serif" font-size="11" font-weight="700" fill="#0284c7">Tap Story</text>
  </g>

  <!-- Card 2: Instagram Carousel -->
  <g transform="translate(200, 560)" filter="url(#shadow)">
    <rect width="135" height="370" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect width="135" height="40" rx="18" fill="#e11d48"/>
    <text x="20" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Instagram</text>
    <!-- Carousel Preview -->
    <rect x="14" y="55" width="107" height="130" rx="12" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1.5"/>
    <rect x="24" y="75" width="87" height="14" rx="4" fill="#db2777"/>
    <text x="28" y="86" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">Slide 1/5</text>
    <rect x="24" y="102" width="80" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="24" y="114" width="75" height="6" rx="3" fill="#e2e8f0"/>
    <!-- Carousel Dots -->
    <circle cx="55" cy="170" r="3.5" fill="#db2777"/>
    <circle cx="67" cy="170" r="3.5" fill="#cbd5e1"/>
    <circle cx="79" cy="170" r="3.5" fill="#cbd5e1"/>
    <rect x="14" y="205" width="107" height="12" rx="3" fill="#f1f5f9"/>
    <text x="18" y="214" font-family="sans-serif" font-size="9" font-weight="600" fill="#64748b">#CleanEnergy #2026</text>
    <rect x="14" y="230" width="100" height="8" rx="4" fill="#94a3b8"/>
    <rect x="14" y="246" width="90" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="24" y="320" width="87" height="28" rx="14" fill="#ffe4e6"/>
    <text x="36" y="338" font-family="sans-serif" font-size="11" font-weight="700" fill="#e11d48">Export IG</text>
  </g>

  <!-- Card 3: WhatsApp Post -->
  <g transform="translate(355, 560)" filter="url(#shadow)">
    <rect width="135" height="370" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect width="135" height="40" rx="18" fill="#16a34a"/>
    <text x="24" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">WhatsApp</text>
    <!-- Chat Bubble -->
    <rect x="14" y="55" width="107" height="200" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="22" y="80" font-family="sans-serif" font-size="11" font-weight="700" fill="#15803d">🚨 BREAKING</text>
    <rect x="22" y="95" width="90" height="8" rx="4" fill="#166534"/>
    <rect x="22" y="110" width="80" height="6" rx="3" fill="#86efac"/>
    <rect x="22" y="122" width="85" height="6" rx="3" fill="#86efac"/>
    <rect x="22" y="140" width="90" height="45" rx="6" fill="#dcfce7"/>
    <text x="28" y="165" font-family="sans-serif" font-size="9" font-weight="600" fill="#166534">🔗 Read full link</text>
    <text x="75" y="245" font-family="sans-serif" font-size="9" fill="#64748b">14:02 ✓✓</text>
    <rect x="24" y="320" width="87" height="28" rx="14" fill="#dcfce7"/>
    <text x="34" y="338" font-family="sans-serif" font-size="11" font-weight="700" fill="#16a34a">Broadcast</text>
  </g>

  <!-- Card 4: Push Notification -->
  <g transform="translate(510, 560)" filter="url(#shadow)">
    <rect width="135" height="370" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect width="135" height="40" rx="18" fill="#f59e0b"/>
    <text x="16" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Push Alert</text>
    <!-- Push Banner Preview -->
    <rect x="12" y="55" width="111" height="115" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <circle cx="24" cy="72" r="6" fill="#d97706"/>
    <text x="35" y="76" font-family="sans-serif" font-size="9" font-weight="700" fill="#92400e">NEWS ALERT</text>
    <text x="18" y="98" font-family="sans-serif" font-size="10" font-weight="700" fill="#78350f">Summit Alert</text>
    <rect x="18" y="110" width="98" height="6" rx="3" fill="#f59e0b" opacity="0.7"/>
    <rect x="18" y="122" width="80" height="6" rx="3" fill="#f59e0b" opacity="0.5"/>
    <rect x="18" y="140" width="50" height="16" rx="8" fill="#d97706"/>
    <text x="26" y="152" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff">A/B Test</text>
    <rect x="12" y="190" width="111" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="18" y="215" font-family="sans-serif" font-size="10" font-weight="600" fill="#475569">CTR: 14.8%</text>
    <text x="18" y="235" font-family="sans-serif" font-size="9" fill="#64748b">Sent to 45k</text>
    <rect x="24" y="320" width="87" height="28" rx="14" fill="#fef3c7"/>
    <text x="36" y="338" font-family="sans-serif" font-size="11" font-weight="700" fill="#d97706">Send Push</text>
  </g>

  <!-- Card 5: Newsletter Snippet -->
  <g transform="translate(665, 560)" filter="url(#shadow)">
    <rect width="135" height="370" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect width="135" height="40" rx="18" fill="#6366f1"/>
    <text x="18" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Newsletter</text>
    <!-- Email Digest Preview -->
    <rect x="14" y="55" width="107" height="200" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
    <text x="22" y="78" font-family="sans-serif" font-size="10" font-weight="700" fill="#4338ca">DAILY DIGEST</text>
    <rect x="22" y="92" width="90" height="8" rx="4" fill="#4f46e5"/>
    <rect x="22" y="108" width="90" height="6" rx="3" fill="#a5b4fc"/>
    <rect x="22" y="120" width="85" height="6" rx="3" fill="#a5b4fc"/>
    <rect x="22" y="132" width="75" height="6" rx="3" fill="#c7d2fe"/>
    <rect x="22" y="150" width="90" height="24" rx="6" fill="#4338ca"/>
    <text x="32" y="166" font-family="sans-serif" font-size="10" font-weight="600" fill="#ffffff">Read Online</text>
    <text x="22" y="230" font-family="sans-serif" font-size="9" fill="#6366f1">98.4% Deliver</text>
    <rect x="24" y="320" width="87" height="28" rx="14" fill="#e0e7ff"/>
    <text x="34" y="338" font-family="sans-serif" font-size="11" font-weight="700" fill="#4338ca">Curate Ed.</text>
  </g>

  <!-- Card 6: X Thread -->
  <g transform="translate(820, 560)" filter="url(#shadow)">
    <rect width="130" height="370" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect width="130" height="40" rx="18" fill="#0f172a"/>
    <text x="24" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">X Thread</text>
    <!-- Thread Preview -->
    <rect x="12" y="55" width="106" height="210" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="26" cy="75" r="8" fill="#0f172a"/>
    <text x="40" y="75" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Odin News</text>
    <text x="40" y="86" font-family="sans-serif" font-size="8" fill="#64748b">@odin · 1/6</text>
    <line x1="26" y1="87" x2="26" y2="135" stroke="#94a3b8" stroke-width="2"/>
    <rect x="20" y="98" width="90" height="6" rx="3" fill="#334155"/>
    <rect x="20" y="110" width="85" height="6" rx="3" fill="#64748b"/>
    <circle cx="26" cy="148" r="8" fill="#334155"/>
    <text x="40" y="152" font-family="sans-serif" font-size="8" font-weight="600" fill="#0f172a">2/6 Thread</text>
    <rect x="20" y="165" width="90" height="6" rx="3" fill="#64748b"/>
    <rect x="20" y="177" width="80" height="6" rx="3" fill="#94a3b8"/>
    <rect x="20" y="320" width="90" height="28" rx="14" fill="#f1f5f9"/>
    <text x="28" y="338" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f172a">Schedule</text>
  </g>
</svg>